name: Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          for v in COOLIFY_URL COOLIFY_TOKEN APP_UUID; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; exit 1; fi
          done

          response=$(curl -sS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json" \
            -w '\n%{http_code}' \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${APP_UUID}&force=false")

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"

          if [ "$code" != "200" ]; then
            echo "::error::Coolify returned HTTP $code"
            exit 1
          fi
          echo "Deployment queued."
